on:
    release:
        types:
            - published

name: release

jobs:
    pypi:
        name: upload release to PyPI
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v7

            - name: build
              run: uv build

            - name: publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_APITOKEN }}
