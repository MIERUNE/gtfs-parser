[project]
name = "gtfs_parser"
version = "0.3.0"
description = "parse and aggregate GTFS"
authors = [{ name = "MIERUNE Inc." }, { name = "Kanahiro IGUCHI" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.3.3"]

[project.urls]
Homepage = "https://github.com/MIERUNE"
Repository = "https://github.com/MIERUNE/gtfs-parser"

[project.scripts]
gtfs-parser = "gtfs_parser.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter
